<!-- Вставить один раз в DOM (в начало страницы/экрана). Даёт рефракцию фона под .glass в Chrome; Safari игнорирует url() в backdrop-filter и остаётся на блюре. scale 12 — норма, 8 — мягче, 16 — «плывёт». -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="lg-refract" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
